<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Sorting Ceremony</title>
<meta name="description" content="Step into the candlelit hall. Answer honestly. The Hat will decide.">
<meta property="og:title" content="The Sorting Ceremony">
<meta property="og:description" content="Fourteen questions. One ancient Hat. Which house will claim you?">
<meta name="theme-color" content="#0b0a12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;800&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--gold:#d9b46a;--gold2:#f5dfa3;--ink:#efe3c8;--bg:#0b0a12;--acc:#d9b46a;--acc2:#7a5a1e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IM Fell English',Georgia,serif;overflow:hidden}
#sky{position:fixed;inset:0;z-index:0}
.vign{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,transparent 0,rgba(0,0,0,.35) 55%,rgba(0,0,0,.85) 100%)}
.hall{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(56px + env(safe-area-inset-top)) 20px calc(60px + env(safe-area-inset-bottom));opacity:0;pointer-events:none;transform:translateY(24px) scale(.98);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.scene>*{flex-shrink:0}.scene>:first-child{margin-top:auto}.scene>:last-child{margin-bottom:auto}
.scene.on{opacity:1;pointer-events:auto;transform:none}
h1{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:clamp(34px,9vw,68px);line-height:1.05;margin:0 0 6px;text-align:center;background:linear-gradient(180deg,#fff4cf,#d9b46a 55%,#8a6420);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(217,180,106,.35));letter-spacing:.02em}
.sub{font-style:italic;font-size:clamp(17px,4.4vw,22px);text-align:center;max-width:520px;opacity:.88;margin:6px 0 26px}
.orn{width:220px;height:22px;margin:4px auto 10px;display:block}
.btn{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:15px;color:#1b1206;background:linear-gradient(180deg,#f8e2a6,#d4a94f 60%,#a77b2b);border:1px solid #fff0c2;border-radius:999px;padding:16px 34px;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 10px 30px rgba(217,180,106,.25),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .2s,box-shadow .3s,opacity .3s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 14px 40px rgba(217,180,106,.45)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.5s infinite}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.ghost{background:none;color:var(--gold);border:1px solid rgba(217,180,106,.5);box-shadow:none}
.ghost::after{display:none}
.parch{width:min(560px,100%);background:linear-gradient(160deg,rgba(40,30,18,.82),rgba(18,14,10,.88));border:1px solid rgba(217,180,106,.35);border-radius:18px;padding:26px 22px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 60px rgba(217,180,106,.06);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);position:relative}
.parch::before,.parch::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--gold);opacity:.6}
.parch::before{top:8px;left:8px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.parch::after{bottom:8px;right:8px;border-left:0;border-top:0;border-radius:0 0 6px 0}
label.lbl{font-family:'Cinzel',serif;letter-spacing:.2em;font-size:12px;text-transform:uppercase;color:var(--gold);display:block;text-align:center;margin-bottom:12px}
input.name{width:100%;font-family:'IM Fell English',serif;font-size:28px;text-align:center;color:var(--gold2);background:transparent;border:0;border-bottom:1px solid rgba(217,180,106,.5);padding:10px;outline:none;caret-color:var(--gold)}
input.name::placeholder{color:rgba(239,227,200,.3);font-style:italic}
.qnum{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;text-align:center;opacity:.85}
.qtext{font-size:clamp(21px,5.4vw,28px);line-height:1.25;text-align:center;margin:10px 0 20px}
.opts{display:grid;gap:10px}
.opt{font-family:'IM Fell English',serif;font-size:18px;text-align:left;color:var(--ink);background:rgba(255,240,200,.04);border:1px solid rgba(217,180,106,.25);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .25s;display:flex;gap:12px;align-items:center;opacity:0;transform:translateY(10px);animation:rise .5s forwards}
.opt:hover{background:rgba(217,180,106,.1);border-color:rgba(217,180,106,.6)}
.opt.sel{background:linear-gradient(90deg,rgba(217,180,106,.28),rgba(217,180,106,.08));border-color:var(--gold2);box-shadow:0 0 22px rgba(217,180,106,.25)}
.opt .glyph{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid rgba(217,180,106,.5);display:grid;place-items:center;font-family:'Cinzel',serif;font-size:13px;color:var(--gold)}
@keyframes rise{to{opacity:1;transform:none}}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{aspect-ratio:1/1;border-radius:14px;border:1px solid rgba(217,180,106,.3);background:radial-gradient(circle at 50% 35%,rgba(217,180,106,.16),rgba(0,0,0,.2) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:all .35s;padding:10px;opacity:0;transform:rotateY(70deg);animation:flip .7s forwards;perspective:600px}
.card svg{width:50%;height:auto;filter:drop-shadow(0 0 10px rgba(217,180,106,.4))}
.card span{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.08em;text-align:center;color:var(--gold2)}
.card:hover{transform:translateY(-4px)}
.card.sel{border-color:var(--gold2);box-shadow:0 0 30px rgba(217,180,106,.4);background:radial-gradient(circle at 50% 35%,rgba(217,180,106,.35),rgba(0,0,0,.2) 70%)}
@keyframes flip{to{opacity:1;transform:none}}
.slider{margin:22px 4px 8px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:linear-gradient(90deg,#3a2c14,var(--gold),#3a2c14);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d8,#d9b46a 50%,#7a5a1e);box-shadow:0 0 20px rgba(217,180,106,.7);cursor:grab;border:0}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d8,#d9b46a 50%,#7a5a1e);border:0}
.ends{display:flex;justify-content:space-between;font-style:italic;font-size:15px;opacity:.8;margin-top:12px;gap:20px}
.ends span:last-child{text-align:right}
.sval{text-align:center;font-family:'Cinzel',serif;color:var(--gold2);font-size:15px;letter-spacing:.1em;min-height:22px}
.rank .opt .glyph{background:rgba(0,0,0,.3)}
.rank .opt.sel .glyph{background:var(--gold);color:#1b1206;font-weight:800}
.hint{text-align:center;font-style:italic;font-size:14px;opacity:.65;margin-top:12px}
.timer{height:4px;background:rgba(217,180,106,.15);border-radius:4px;overflow:hidden;margin:-6px 0 18px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff7a3a,var(--gold2));transform-origin:left;box-shadow:0 0 10px #ffb05a}
.timed .opts{grid-template-columns:1fr 1fr}
.timed .opt{justify-content:center;text-align:center;min-height:70px;font-size:20px}
.navrow{display:flex;justify-content:center;margin-top:20px;min-height:54px}
/* progress candle */
.prog{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));z-index:5;display:flex;justify-content:center;opacity:0;transition:opacity .6s;pointer-events:none}
.prog.on{opacity:1}
.ribbon{width:min(520px,86vw);height:6px;border-radius:6px;background:rgba(217,180,106,.15);position:relative;margin-top:14px}
.ribbon b{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#8a6420,var(--gold2));transition:width .8s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(245,223,163,.6)}
.ribbon .flame{position:absolute;top:-17px;width:12px;height:18px;margin-left:-6px;transition:left .8s cubic-bezier(.2,.8,.2,1);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff,#ffd27a 40%,#ff8a2a 75%,transparent 80%);animation:flick .15s infinite alternate;filter:blur(.3px) drop-shadow(0 0 8px #ffb347)}
@keyframes flick{to{transform:scale(1.08,.94) translateY(1px)}}
/* hat */
.hatwrap{width:min(300px,70vw);position:relative}
.hatwrap svg{width:100%;height:auto;overflow:visible}
.hat{transform-origin:50% 90%;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.mouth{transform-origin:50% 50%;transform-box:fill-box}
.talking .mouth{animation:talk .18s infinite alternate}
@keyframes talk{to{transform:scaleY(2.2)}}
.speech{min-height:120px;width:min(560px,100%);text-align:center;font-size:clamp(20px,5.2vw,26px);font-style:italic;line-height:1.35;margin-top:14px;color:var(--gold2);text-shadow:0 0 18px rgba(217,180,106,.35)}
.speech .cur{display:inline-block;width:2px;height:1em;background:var(--gold2);vertical-align:-3px;animation:blink 1s infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
/* reveal */
#reveal .crest{width:min(200px,50vw);aspect-ratio:200/240;height:auto;filter:drop-shadow(0 0 40px var(--acc));transform:scale(.2) rotate(-25deg);opacity:0}
#reveal.on .crest{animation:crest 1.4s .2s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes crest{to{transform:none;opacity:1}}
.hname{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:clamp(38px,11vw,92px);margin:8px 0 0;letter-spacing:.04em;color:var(--acc);text-shadow:0 0 30px var(--acc),0 0 2px #fff;opacity:0;transform:translateY(20px);text-align:center}
#reveal.on .hname{animation:rise 1s 1.1s forwards}
.fade{opacity:0}
#reveal.on .fade{animation:rise 1s forwards}
.traits{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.traits span{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.15em;text-transform:uppercase;padding:7px 12px;border-radius:999px;border:1px solid var(--acc);color:var(--ink);background:color-mix(in srgb,var(--acc) 18%,transparent)}
.desc{font-size:18px;line-height:1.5;text-align:center;max-width:500px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.flash{position:fixed;inset:0;z-index:20;background:radial-gradient(circle,#fff,var(--acc) 40%,transparent 75%);opacity:0;pointer-events:none}
.flash.go{animation:fl 1.6s ease-out}
@keyframes fl{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
#fx{position:fixed;inset:0;z-index:15;pointer-events:none}
.snd{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top));z-index:30;width:42px;height:42px;border-radius:50%;border:1px solid rgba(217,180,106,.45);background:rgba(10,8,14,.6);color:var(--gold);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px)}
.snd svg{width:20px;height:20px}
footer{position:fixed;bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom))!important;padding-top:18px!important;background:linear-gradient(transparent,rgba(8,7,12,.92) 55%);left:0;right:0;text-align:center;font-size:11px;letter-spacing:.06em;color:rgba(239,227,200,.5);z-index:3;font-family:'Cinzel',serif;pointer-events:none;padding:0 10px}
.toast{position:fixed;left:50%;bottom:60px;transform:translate(-50%,20px);background:#1b1408;border:1px solid var(--gold);padding:10px 18px;border-radius:999px;font-family:'Cinzel',serif;font-size:13px;opacity:0;transition:all .4s;z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}
.shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<svg class="hall" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<defs><linearGradient id="hw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1526" stop-opacity="0"/><stop offset="1" stop-color="#1a1526"/></linearGradient></defs>
<g fill="url(#hw)" stroke="rgba(217,180,106,.08)">
<path d="M0 800V300Q40 180 80 300V800z"/><path d="M320 800V300Q360 180 400 300V800z"/>
<path d="M95 800V360Q130 250 165 360V800z" opacity=".6"/><path d="M235 800V360Q270 250 305 360V800z" opacity=".6"/>
</g></svg>
<div class="vign"></div>
<canvas id="fx"></canvas>
<div class="flash" id="flash"></div>
<button class="snd" id="snd" aria-label="Toggle sound"></button>
<div class="prog" id="prog"><div class="ribbon"><b id="pb"></b><i class="flame" id="pf"></i></div></div>

<main>
<section class="scene on" id="intro">
  <svg class="orn" viewBox="0 0 220 22"><path d="M0 11h85M135 11h85" stroke="#d9b46a" stroke-width="1"/><path d="M110 2l9 9-9 9-9-9z" fill="none" stroke="#d9b46a"/><circle cx="110" cy="11" r="2.5" fill="#f5dfa3"/><circle cx="92" cy="11" r="1.5" fill="#d9b46a"/><circle cx="128" cy="11" r="1.5" fill="#d9b46a"/></svg>
  <h1>The Sorting<br>Ceremony</h1>
  <svg class="orn" viewBox="0 0 220 22"><path d="M0 11h85M135 11h85" stroke="#d9b46a" stroke-width="1"/><path d="M110 2l9 9-9 9-9-9z" fill="none" stroke="#d9b46a"/></svg>
  <p class="sub">The candles are lit. The hall falls silent. An ancient Hat waits to look into the corners of your mind.</p>
  <button class="btn" id="begin">Enter the Hall</button>
</section>

<section class="scene" id="nameS">
  <div class="parch">
    <label class="lbl" for="nm">Step forward, first-year</label>
    <p class="qtext" style="margin-top:0">By what name shall the Hat know you?</p>
    <input class="name" id="nm" autocomplete="given-name" maxlength="24" placeholder="Your first name" enterkeyhint="go">
    <div class="navrow"><button class="btn" id="nameGo" disabled>Take a Seat</button></div>
  </div>
</section>

<section class="scene" id="quiz"><div class="parch" id="qbox"></div></section>

<section class="scene" id="hatS">
  <div class="hatwrap" id="hatwrap">
  <svg viewBox="0 0 300 260"><defs>
   <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4128"/><stop offset=".6" stop-color="#3a2817"/><stop offset="1" stop-color="#20160c"/></linearGradient>
   <radialGradient id="hl" cx=".5" cy="1" r=".8"><stop offset="0" stop-color="#d9b46a" stop-opacity=".35"/><stop offset="1" stop-color="#d9b46a" stop-opacity="0"/></radialGradient></defs>
   <ellipse cx="150" cy="240" rx="140" ry="18" fill="url(#hl)"/>
   <g class="hat">
    <path d="M20 225Q150 255 280 225Q270 205 230 200Q150 215 70 200Q30 205 20 225z" fill="url(#hg)" stroke="#1a1209" stroke-width="2"/>
    <path d="M75 205Q90 150 110 120Q125 80 150 60Q170 40 195 30Q215 26 222 40Q205 38 192 52Q180 70 178 100Q182 150 228 203Q150 222 75 205z" fill="url(#hg)" stroke="#1a1209" stroke-width="2"/>
    <path d="M222 40Q238 52 230 70Q225 58 214 55z" fill="#3a2817" stroke="#1a1209" stroke-width="2"/>
    <path d="M100 160Q120 150 140 162M118 120Q135 112 160 120M150 80Q165 74 178 82" stroke="#1a1209" stroke-width="3" fill="none" opacity=".7"/>
    <path d="M105 150Q122 140 140 148" stroke="#0c0804" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M152 146Q170 136 186 146" stroke="#0c0804" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse class="mouth" cx="148" cy="182" rx="26" ry="4" fill="#0c0804"/>
   </g></svg>
  </div>
  <div class="speech" id="speech"></div>
</section>

<section class="scene" id="reveal">
  <svg class="crest" id="crest" viewBox="0 0 200 240"></svg>
  <div class="hname" id="hname"></div>
  <p class="sub fade" id="hmotto" style="margin:4px 0 0;animation-delay:1.5s"></p>
  <div class="traits fade" id="htraits" style="animation-delay:1.8s"></div>
  <p class="desc fade" id="hdesc" style="animation-delay:2.1s"></p>
  <div class="row fade" style="animation-delay:2.5s">
    <button class="btn" id="share">Share the Ceremony</button>
    <button class="btn ghost" id="again">Sort Another</button>
  </div>
</section>
</main>
<div class="toast" id="toast"></div>
<footer>A fan-made tribute for fun · Not affiliated with or endorsed by any author, studio, or rights holder</footer>

<script>
(()=>{
const $=s=>document.querySelector(s), W=window;
/* ---------- candles + embers ---------- */
const sky=$('#sky'),sx=sky.getContext('2d');let SW,SH,DPR=Math.min(2,W.devicePixelRatio||1),cand=[],stars=[];
function rs(){SW=innerWidth;SH=innerHeight;for(const c of [sky,$('#fx')]){c.width=SW*DPR;c.height=SH*DPR;c.style.width=SW+'px';c.style.height=SH+'px'}
 sx.setTransform(DPR,0,0,DPR,0,0);fx.setTransform(DPR,0,0,DPR,0,0);
 const n=Math.round(Math.min(46,SW*SH/14000));cand=[...Array(n)].map(()=>({x:Math.random()*SW,y:Math.random()*SH*.85,z:.35+Math.random()*.9,p:Math.random()*6.28,s:.3+Math.random()*.6}));
 stars=[...Array(120)].map(()=>({x:Math.random()*SW,y:Math.random()*SH*.6,r:Math.random()*1.2,p:Math.random()*6.28}))}
const fx=$('#fx').getContext('2d');
let t0=0;function drawSky(t){t0=t/1000;const g=sx.createLinearGradient(0,0,0,SH);g.addColorStop(0,'#090814');g.addColorStop(.6,'#120d1c');g.addColorStop(1,'#1c130c');sx.fillStyle=g;sx.fillRect(0,0,SW,SH);
 for(const s of stars){sx.globalAlpha=.25+.35*Math.sin(t0*1.3+s.p);sx.fillStyle='#fff8e0';sx.beginPath();sx.arc(s.x,s.y,s.r,0,6.28);sx.fill()}
 sx.globalAlpha=1;
 for(const c of cand){const y=c.y+Math.sin(t0*c.s+c.p)*10*c.z,x=c.x+Math.cos(t0*c.s*.7+c.p)*4,h=26*c.z,w=6*c.z;
  const gl=sx.createRadialGradient(x,y-h/2-6*c.z,0,x,y-h/2-6*c.z,40*c.z);gl.addColorStop(0,'rgba(255,200,110,.35)');gl.addColorStop(1,'rgba(255,200,110,0)');sx.fillStyle=gl;sx.fillRect(x-40*c.z,y-h-46*c.z,80*c.z,80*c.z);
  const cg=sx.createLinearGradient(x-w/2,0,x+w/2,0);cg.addColorStop(0,'#b9a47a');cg.addColorStop(.5,'#fff3d6');cg.addColorStop(1,'#a8926a');sx.fillStyle=cg;sx.fillRect(x-w/2,y-h/2,w,h);
  const f=1+Math.sin(t0*18+c.p)*.12;sx.fillStyle='#ffcf6e';sx.beginPath();sx.ellipse(x,y-h/2-5*c.z,2.4*c.z,6*c.z*f,0,0,6.28);sx.fill();sx.fillStyle='#fffbe8';sx.beginPath();sx.ellipse(x,y-h/2-4*c.z,1*c.z,3*c.z,0,0,6.28);sx.fill()}
 }
/* particles for fx layer */
let parts=[];function burst(cols,n=160,ox=SW/2,oy=SH*.36){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=3+Math.random()*9;parts.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,l:1,d:.006+Math.random()*.012,c:cols[i%cols.length],s:2+Math.random()*4,r:Math.random()*6.28,sp:Math.random()<.5})}}

 parts=parts.filter(p=>p.l>0&&p.y<SH+20);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.08;p.l-=p.d;p.r+=.1;fx.globalAlpha=Math.max(0,p.l);fx.fillStyle=p.c;

const pickR=a=>a[Math.floor(Math.random()*a.length)];
function lines(h){const L=[],ev=lean(h),alt=second(h),hn=H[alt].n;
 const tease={0:'a bold streak, a hunger to prove yourself',1:'a good heart, loyal to the bone',2:'a quick and curious mind',3:'a sharp ambition, oh yes'};
 const want={0:['Courage. Plenty of courage, I see…','You would rather stand and fight than wonder what might have been.','Yes… the fire in you burns hotter than you let on.'],
  1:['Loyalty… such loyalty. Rarer than gold.','You would carry a friend across a battlefield and never mention it.','Patient. Fair. Unafraid of hard work. Excellent.'],
  2:['A mind like a library with no locked doors…','You don\'t just answer questions. You question the answers.','Clever. Very clever indeed.'],
  3:['Ambition… oh, there is ambition in you.','You play the long game, and you play to win.','Resourceful. Determined. You would do well, very well.']};
 L.push(pickR([`Hmm… ${name}. Let me see now…`,`Ahh, ${name}. Sit still, now…`,`${name}… yes, yes. Let\'s have a look inside…`]));
 L.push(`Difficult. Very difficult. I see ${tease[alt]}… ${hn} could have you…`);
 const q=ev.filter(p=>p.k!=='r'),e1=q.length?pickR(q):null;
 L.push(want[h][0]);
 if(e1)L.push(`"${e1.label.replace(/[.…]$/,'')}". You said it without hesitation. That tells me a great deal.`);else L.push(want[h][1]);
 const r=picks.find(p=>p.k==='r');if(r&&ev.includes(r))L.push(`And you placed ${r.label.toLowerCase()} above all else. Telling…`);else L.push(want[h][2]);
 L.push('But where to put you…');L.push('I know.');return L}
async function type(el,txt){const hw=$('#hatwrap');hw.classList.add('talking');el.innerHTML='';const sp=document.createElement('span'),cu=document.createElement('i');cu.className='cur';el.append(sp,cu);
 for(const ch of txt){sp.textContent+=ch;if(on&&Math.random()<.25)chime([180+Math.random()*80],.06,.012);await sleep(ch===','||ch==='.'||ch==='…'?160:34)}hw.classList.remove('talking')}
async function ceremony(){$('#prog').classList.remove('on');const h=judge();show('hatS');rumble();await sleep(1100);const sp=$('#speech');
 for(const l of lines(h)){await type(sp,l);await sleep(l==='I know.'?900:1300)}
 sp.innerHTML='';const big=document.createElement('div');big.style.cssText='font-family:Cinzel Decorative,serif;font-style:normal;font-size:clamp(34px,10vw,64px);color:'+H[h].c+';text-shadow:0 0 30px '+H[h].c;big.textContent=H[h].n.toUpperCase()+'!';sp.append(big);
 vib([60,40,120]);await sleep(900);reveal(h)}
function reveal(h){const x=H[h];document.documentElement.style.setProperty('--acc',x.c);
 $('#crest').innerHTML=crestSVG(x);$('#hname').textContent=x.n;$('#hmotto').textContent=`${name}, ${x.motto.charAt(0).toLowerCase()+x.motto.slice(1)}.`;
 $('#htraits').innerHTML=x.t.map(t=>`<span>${t}</span>`).join('');$('#hdesc').textContent=x.d;
 const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');show('reveal');fanfare();
 setTimeout(()=>{burst(x.cols,220);burst(x.cols,120,SW*.2,SH*.5);burst(x.cols,120,SW*.8,SH*.5);rain=x.cols},350);setTimeout(()=>rain=null,9000)}

/* ---------- share ---------- */
const url=location.origin+location.pathname;
$('#share').onclick=async()=>{const d={title:'The Sorting Ceremony',text:'The Hat has spoken. Find out which house claims you:',url};
 if(navigator.share){try{await navigator.share(d);return}catch(e){if(e.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(url);toast('Link copied. Send it to someone brave.')}catch(e){prompt('Copy this link:',url)}};
$('#again').onclick=()=>{rain=null;parts=[];nm.value='';$('#nameGo').disabled=true;document.documentElement.style.setProperty('--acc','#d9b46a');show('nameS');setTimeout(()=>nm.focus(),700)};
})();
